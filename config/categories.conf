# ============================================================
# Catégories de projets numérotées — source unique pour new_project.sh
# Méthode de chaque catégorie : sf-handbook/methodology/categories.md ; attribution des numéros : sf-handbook/registry.md
# Ajouter une catégorie = une ligne ici + une section dans categories.md (+ un profil si l'arborescence est nouvelle).
#
# FAMILLE | catégorie | profil par défaut | registres (allowed | no) | dossiers ajoutés | libellé
# ============================================================
IP  | ip  | ip    | allowed | -      | IP réutilisable sur bus (bloc + registres + driver)
SYS | sys | soc   | allowed | -      | Système / SoC (intégration d'IP, CPU, firmware)
DEM | dem | board | no      | -      | Démonstrateur sur carte
EXP | exp | ip    | no      | python | Expérience / étude (mesure, comparaison, analyse)
