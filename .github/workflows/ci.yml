# CI de sf-tools : tests de non-régression (tests/run_tests.sh).
# Outils installés par ci/setup_tools.sh (OSS CAD Suite, venvs, clang-format), en cache comme dans la CI
# des projets (templates/ci.yml).
name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cache des outils (OSS CAD Suite, venvs)
        uses: actions/cache@v4
        with:
          path: ~/tools
          key: sf-tools-${{ runner.os }}-${{ hashFiles('ci/versions.env', 'ci/requirements-*.txt') }}
      - name: Installation des outils
        run: bash ci/setup_tools.sh
      - name: Configuration
        run: bash bin/sf_config.sh
      - name: Tests
        run: tests/run_tests.sh
