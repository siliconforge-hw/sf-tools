# CI de sf-tools : tests de non-régression (tests/run_tests.sh).
# Seuls les outils nécessaires sont installés : venv PeakRDL épinglé et clang-format (pas d'OSS CAD Suite).
name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Outils (clang-format, venv PeakRDL)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends clang-format
          python3 -m venv ~/tools/venvs/peakrdl
          ~/tools/venvs/peakrdl/bin/pip install -q -r ci/requirements-peakrdl.txt
      - name: Tests
        run: tests/run_tests.sh
